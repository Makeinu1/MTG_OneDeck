name: R6 documentation gate check
on:
  push:
    branches: [r6-ux-constitution]
permissions:
  contents: read
jobs:
  docs:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Documentation contract gate
        run: node scripts/checks/check-docs.mjs
