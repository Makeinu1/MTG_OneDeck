name: R4 state.apply migration
on:
  push:
    branches: [r4a-formal-manual-inventory]
    paths: [.github/r4-state-apply.marker]
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact state.apply migration
        run: python scripts/r4-state-apply-migration.py
      - name: Align generated regressions with existing contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engine/__tests__/cockpitR4State.test.ts')
          text = path.read_text()
          old = "      (event) => event.type === 'zoneChange' && ids.includes(event.physicalCardId),\n"
          new = "      (event) =>\n        event.type === 'zoneChange' &&\n        event.reason === 'sba' &&\n        ids.includes(event.physicalCardId),\n"
          if text.count(old) != 1:
              raise SystemExit('generated SBA event assertion changed unexpectedly')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/online/cloudflare/__tests__/cockpitR4StateSession.test.ts')
          text = path.read_text()
          old = "import type { OnlineCloudflareSqlStorage } from '../types';\n"
          new = "import { r4OperationCreatesKnowledgeBarrier } from '../cockpitR4Authority';\nimport type { OnlineCloudflareSqlStorage } from '../types';\n"
          if text.count(old) != 1:
              raise SystemExit('state session import changed unexpectedly')
          text = text.replace(old, new, 1)
          old = "          requestId: `state-${++seq}`,\n"
          new = "          requestId: `state-operation-${++seq}`,\n"
          if text.count(old) != 1:
              raise SystemExit('generated state request id changed unexpectedly')
          text = text.replace(old, new, 1)
          old = "    const missing = await commit({ type: 'state.apply', graveyardIds: [cardId] });\n"
          new = """    expect(\n      r4OperationCreatesKnowledgeBarrier(record.table, {\n        type: 'state.apply',\n        graveyardIds: [cardId],\n      }),\n    ).toBe(true);\n\n    const missing = await commit({ type: 'state.apply', graveyardIds: [cardId] });\n"""
          if text.count(old) != 1:
              raise SystemExit('state knowledge assertion insertion changed unexpectedly')
          text = text.replace(old, new, 1)
          old = "    expect(applied.value.canUndo).toBe(false);\n\n    const persisted = JSON.parse(\n      storage.sql.exec<{ data: string }>('SELECT data FROM cockpit_session WHERE id = 1').toArray()[0].data,\n    ) as { knowledgeEpoch?: number };\n    expect(persisted.knowledgeEpoch).toBe(1);\n"
          new = "    // Solo Undo remains available; knowledge-epoch blocking is a multiplayer trust boundary.\n    expect(applied.value.canUndo).toBe(true);\n"
          if text.count(old) != 1:
              raise SystemExit('state solo undo assertion changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/components/game/CockpitSelectionTools.test.tsx')
          text = path.read_text()
          old = "    expect(screen.send).toHaveBeenCalledWith(expect.objectContaining({ type: 'arrange' }));\n"
          new = """    expect(screen.send).toHaveBeenCalledWith(\n      expect.objectContaining({ type: 'arrange' }),\n      { kind: 'unbound' },\n    );\n"""
          if text.count(old) != 1:
              raise SystemExit('SelectionTools arrange assertion changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Engine state-action regression
        run: >-
          node node_modules/vitest/vitest.mjs run --project core
          src/engine/__tests__/cockpitR4State.test.ts
          src/engine/__tests__/cockpitR4.test.ts
          src/engine/__tests__/cockpitR4ManualTrigger.test.ts
          src/engine/__tests__/cockpitR31.test.ts
      - name: Server and UI state-action regression
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/online/cloudflare/__tests__/cockpitR4StateSession.test.ts
          src/online/cloudflare/__tests__/cockpitR4FormalSession.test.ts
          src/online/cloudflare/__tests__/cockpitR4ActivateSession.test.ts
          src/components/game/CockpitSelectionTools.state.test.tsx
          src/components/game/CockpitSelectionTools.test.tsx
      - name: Types and build
        run: npm run build
      - name: Lint changed source
        run: >-
          node node_modules/eslint/bin/eslint.js
          src/engine/cockpitTable.ts
          src/engine/cockpitR4.ts
          src/engine/__tests__/cockpitR4State.test.ts
          src/online/cloudflare/cockpitR4Authority.ts
          src/online/cloudflare/__tests__/cockpitR4StateSession.test.ts
          src/components/game/CockpitSelectionTools.tsx
          src/components/game/CockpitSelectionTools.state.test.tsx
          src/components/game/CockpitSelectionTools.test.tsx
          src/components/game/CockpitBattleTools.tsx
      - run: git diff --check
      - name: Commit verified source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/engine/cockpitTable.ts \
            src/engine/cockpitR4.ts \
            src/engine/__tests__/cockpitR4State.test.ts \
            src/online/cloudflare/cockpitR4Authority.ts \
            src/online/cloudflare/__tests__/cockpitR4StateSession.test.ts \
            src/components/game/CockpitSelectionTools.tsx \
            src/components/game/CockpitSelectionTools.state.test.tsx \
            src/components/game/CockpitSelectionTools.test.tsx \
            src/components/game/CockpitBattleTools.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(r4): add human-confirmed state actions"
          git push origin HEAD:r4a-formal-manual-inventory
