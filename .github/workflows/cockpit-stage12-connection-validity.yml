name: Cockpit stage 12 retained connection validity
on:
  push:
    branches: [fix/cockpit-stage12-connection-validity-20260915]
permissions:
  contents: write
jobs:
  stage12:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply focused stage 12 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          client = Path('src/online/browser/cockpitClient.ts')
          text = client.read_text()
          old = "error.message += ' 元の卓の接続情報を保持しています。再接続で元の卓へ戻れます。';"
          new = "error.message += ' 元の卓の接続情報を保持しています。再接続して有効性を確認してください。';"
          assert text.count(old) == 1
          client.write_text(text.replace(old, new, 1))

          test = Path('src/online/browser/__tests__/cockpitClient.test.ts')
          text = test.read_text()
          marker = "retained previous connection is revalidated before it is described as usable"
          assert marker not in text
          text += """

          it.each([
            ['expired', 'SESSION_EXPIRED', 410],
            ['kicked', 'AUTHENTICATION_REQUIRED', 403],
          ] as const)(
            'retained previous connection is revalidated before it is described as usable: %s',
            async (_label, previousFailure, status) => {
              vi.useFakeTimers();
              const previous = existingConnection();
              const destination = crypto.randomUUID();
              const invite = destination + '.' + crypto.randomUUID() + crypto.randomUUID();
              let previousUnavailable = false;
              vi.stubGlobal(
                'fetch',
                vi.fn((url: string, init: RequestInit) => {
                  const body = JSON.parse(init.body as string) as { type: string };
                  if (url.endsWith(destination) && body.type === 'join')
                    return Promise.resolve(Response.json({ error: 'ADMISSION_CLOSED' }, { status: 403 }));
                  if (url.endsWith(previous.id) && previousUnavailable)
                    return Promise.resolve(Response.json({ error: previousFailure }, { status }));
                  return Promise.resolve(emptyView());
                }),
              );
              const client = testClient();
              const rejected = await client.join(makeDeck(8), invite).catch((error: unknown) => error);
              expect(rejected).toMatchObject({ code: 'ADMISSION_CLOSED', previousRestored: true });
              expect(rejected).toBeInstanceOf(Error);
              expect((rejected as Error).message).toContain(
                '元の卓の接続情報を保持しています。再接続して有効性を確認してください。',
              );
              expect((rejected as Error).message).not.toContain('元の卓へ戻れます');
              expect(storedConnection()).toMatchObject({
                id: previous.id,
                token: previous.token,
                pending: null,
              });

              previousUnavailable = true;
              const unavailable = await client.reconnect().catch((error: unknown) => error);
              expect(unavailable).toMatchObject({ code: previousFailure });
              expect(isCockpitTerminalFailure(unavailable)).toBe(true);
              expect(storedConnection()).toMatchObject({ id: previous.id, token: previous.token });
            },
          );
          """
          test.write_text(text)

          session = Path('src/online/cloudflare/__tests__/cockpitSession.test.ts')
          text = session.read_text()
          expired_pattern = re.compile(
              r"\s*expect\(\s*\(await handleCockpitSession\(request\(\{ type: 'read', token \}\), storage, 4000 \+ COCKPIT_TTL_MS\)\)\s*\.status,\s*\)\.toBe\(410\);"
          )
          expired_replacement = """
              const expired = await handleCockpitSession(
                request({ type: 'read', token }),
                storage,
                4000 + COCKPIT_TTL_MS,
              );
              expect(expired.status).toBe(410);
              expect(await expired.json()).toMatchObject({ error: 'SESSION_EXPIRED' });"""
          text, count = expired_pattern.subn(expired_replacement, text, count=1)
          assert count == 1

          kicked_pattern = re.compile(
              r"\s*expect\(\(await room\.call\(1, \{ type: 'read' \}\)\)\.status\)\.toBe\(403\);"
          )
          kicked_replacement = """
              const kickedRead = await room.call(1, { type: 'read' });
              expect(kickedRead.status).toBe(403);
              expect(kickedRead.value.error).toBe('AUTHENTICATION_REQUIRED');"""
          text, count = kicked_pattern.subn(kicked_replacement, text, count=1)
          assert count == 1
          session.write_text(text)
          PY
      - run: npm ci
      - name: Client retained-connection regressions
        run: node node_modules/vitest/vitest.mjs run src/online/browser/__tests__/cockpitClient.test.ts
      - name: Replay connection-neighbor regression
        run: node node_modules/vitest/vitest.mjs run src/online/browser/__tests__/cockpitReplay.test.tsx
      - name: SQLite expiry and kick regressions
        run: node node_modules/vitest/vitest.mjs run src/online/cloudflare/__tests__/cockpitSession.test.ts
      - name: Build, lint, and diff check
        shell: bash
        run: |
          npm run build
          node node_modules/eslint/bin/eslint.js src/online/browser/cockpitClient.ts src/online/browser/__tests__/cockpitClient.test.ts src/online/cloudflare/__tests__/cockpitSession.test.ts
          git diff --check
      - name: Commit validated tree without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cockpit-stage12-connection-validity.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: verify retained connection before claiming recovery"
          git push origin HEAD:${GITHUB_REF_NAME}
