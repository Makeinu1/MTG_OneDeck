name: Validate A3 stack interaction fixes
on:
  push:
    branches: [fix/cockpit-a3-stack-stage-20260914]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify base and apply isolated A3 transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/components/game/CockpitTableSurface.tsx)" = ddcbf2011e2776f92db817060f90807561d94380
          test "$(git hash-object src/components/game/CockpitSessionScreen.tsx)" = 977649fa38e6bcf4d6abad1449d9a1af76f10f00
          test "$(git hash-object src/components/game/CockpitCardTools.tsx)" = ed55de6164f1ed954b571cc60845166c2d987561
          test "$(git hash-object src/online/cloudflare/cockpitMultiplayer.ts)" = cd711c0afe7e00dfbe26182a528727044f3c2663
          test "$(git hash-object src/components/game/stackWorkspaceModel.ts)" = 1d9a45fe738398d1f9af366187e42c2edb215405
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/a3-stack-transform.py')
          text = p.read_text()
          needle = "`,\n\",\n"
          assert text.count(needle) == 2, text.count(needle)
          p.write_text(text.replace(needle, "`,\\n\",\n"))
          PY
          python .github/a3-stack-transform.py
          python .github/a3-stack-testfix.py
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Dedicated A3 regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/components/game/CockpitStackControls.test.tsx
          src/components/game/CockpitCardTools.test.tsx
          src/components/game/cockpitStackDetail.test.ts
          src/components/game/CockpitStackLki.test.ts
      - name: Neighboring stack, surface, projection and shortcut regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/components/game/CockpitTableSurface.test.tsx
          src/components/game/stackWorkspaceModel.test.ts
          src/online/cloudflare/__tests__/cockpitProjection.test.ts
          src/hooks/useShortcuts.test.tsx
      - name: Types build and changed-file lint
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node node_modules/eslint/bin/eslint.js \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/components/game/CockpitCardTools.tsx \
            src/components/game/cockpitStackDetail.ts \
            src/components/game/stackWorkspaceModel.ts \
            src/online/cloudflare/cockpitMultiplayer.ts \
            src/components/game/CockpitStackControls.test.tsx \
            src/components/game/CockpitCardTools.test.tsx \
            src/components/game/cockpitStackDetail.test.ts \
            src/components/game/CockpitStackLki.test.ts
      - name: Commit only the validated product/test tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/a3-stack-transform.py .github/a3-stack-testfix.py .github/workflows/cockpit-a3-stack-temp.yml
          git add \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/components/game/CockpitCardTools.tsx \
            src/components/game/cockpitStackDetail.ts \
            src/components/game/stackWorkspaceModel.ts \
            src/online/cloudflare/cockpitMultiplayer.ts \
            src/components/game/CockpitStackControls.test.tsx \
            src/components/game/CockpitCardTools.test.tsx \
            src/components/game/cockpitStackDetail.test.ts \
            src/components/game/CockpitStackLki.test.ts
          test -z "$(git status --porcelain | grep '^??' || true)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'staging: validate A3 stack interaction fixes'
          git push origin HEAD:refs/heads/fix/cockpit-a3-stack-stage-20260914
