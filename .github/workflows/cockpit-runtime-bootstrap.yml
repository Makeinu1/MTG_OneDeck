name: Cockpit runtime bootstrap
on:
  push:
    branches: [fix/cockpit-playflow-17-20260914]
    paths: [.github/workflows/cockpit-runtime-bootstrap.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Acquire isolated test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cockpit-runtime"
          cd "$RUNNER_TEMP/cockpit-runtime"
          npm init -y
          npm install --save-exact wrangler playwright
          npm ls --depth=0 > versions.txt
          tar -czf "$RUNNER_TEMP/cockpit-runtime.tar.gz" package.json package-lock.json versions.txt node_modules
          sha256sum "$RUNNER_TEMP/cockpit-runtime.tar.gz" > "$RUNNER_TEMP/cockpit-runtime.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: cockpit-test-runtime
          path: |
            ${{ runner.temp }}/cockpit-runtime.tar.gz
            ${{ runner.temp }}/cockpit-runtime.sha256
          retention-days: 1
          compression-level: 0
