name: R4b final verify
on:
  push:
    branches: [fix/r4b-release-ledgers]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove temporary final verifier
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/r4b-final-verify.yml
          git commit -m 'ci: remove temporary R4b final verifier'
      - name: Verify final release gate
        run: npm run check:release -- --base 3465e00cfb2c1bc76c22fc05b624b8a746b4061d --head HEAD --build-base=/MTG_OneDeck/
      - name: Push verified final branch
        run: git push
