name: Assemble stage 2B turn cleanup candidate
on:
  push:
    branches: [fix/cockpit-stage2b-assemble-20260914]
    paths:
      - .github/stage2b-patch.part4
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and apply the preserved stage 2B patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          BASE=b076af769d0911f491ff99bdfde772ed4f0c9884
          test "$GITHUB_REF" = refs/heads/fix/cockpit-stage2b-assemble-20260914
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object src/components/game/CockpitCleanupTools.tsx)" = 0c2c3472fdace8e0d6ee83799e7a850ce9ef40cc
          test "$(git hash-object src/components/game/CockpitSessionScreen.tsx)" = ace71ee5026ff5336852713404ffdb6834d5d0d7
          test "$(git hash-object src/components/game/CockpitTableSurface.test.tsx)" = 19caff510f9dac9c5e9a581558e181dd851e6540
          test "$(git hash-object src/components/game/CockpitTableSurface.tsx)" = 6a9401473ede4706f545f7dc8f5d5246a2c50ae3
          test "$(git hash-object src/engine/__tests__/cockpitBattle.test.ts)" = e84c618c4d00e9c6136a40f5f5a86f3a37c16a24
          test "$(git hash-object src/engine/__tests__/cockpitMana.test.ts)" = c32d28e85750a93a5bf99d85df644ba4aba45a85
          test "$(git hash-object src/engine/__tests__/cockpitTriggerFacts.test.ts)" = a0c7f2b163968ec0fa3a69471ddfe093bdb14c7d
          test "$(git hash-object src/engine/cockpitTable.ts)" = c8ab974839e3520bc60ae0f77441b0d0ce807d4b
          test "$(git hash-object src/online/cloudflare/__tests__/cockpitSession.test.ts)" = 5d1260a2fc04773ed3e389691dd0932a565ba1d8
          test ! -e src/engine/__tests__/cockpitTurnProgress.test.ts
          test ! -e docs/cockpit-turn-stage2b-2026-09-14.md
          test ! -e scripts/online/cockpit-turn-evidence.mjs
          cat .github/stage2b-patch.part1 .github/stage2b-patch.part2 .github/stage2b-patch.part3 .github/stage2b-patch.part4 > /tmp/stage2b.patch.b64
          base64 -d /tmp/stage2b.patch.b64 > /tmp/stage2b.patch.gz
          gzip -dc /tmp/stage2b.patch.gz > /tmp/stage2b.patch
          echo 'cb589c7af700a6cb826c54ec8f4b2883734fccbc455ffe1b5d1487dd7c1e1d80  /tmp/stage2b.patch' | sha256sum -c -
          git apply --check /tmp/stage2b.patch
          git apply /tmp/stage2b.patch
          test "$(git hash-object docs/cockpit-turn-stage2b-2026-09-14.md)" = 66b1b85a6820d7aeb976c30ca0d1db2375d917fb
          test "$(git hash-object scripts/online/cockpit-turn-evidence.mjs)" = 2aa34e21db09b83e2db6866a10ae4981769a7f76
          test "$(git hash-object src/components/game/CockpitCleanupTools.tsx)" = 0b0874c47b3b1f959870372a2e0a34c9463fa1d7
          test "$(git hash-object src/components/game/CockpitTableSurface.test.tsx)" = 2f77dab599c81fe2c0d15173f5fe6c91e4b2d11d
          test "$(git hash-object src/components/game/CockpitTableSurface.tsx)" = ddcbf2011e2776f92db817060f90807561d94380
          test "$(git hash-object src/engine/__tests__/cockpitBattle.test.ts)" = 3309a2c95ac024355106fad9cae8af1f1bf60209
          test "$(git hash-object src/engine/__tests__/cockpitMana.test.ts)" = 13cb0d29dc918c75c1dcac5a94d746641a7b13c0
          test "$(git hash-object src/engine/__tests__/cockpitTriggerFacts.test.ts)" = 1939d691d6086ad30325d4cb3771668ec758e383
          test "$(git hash-object src/engine/__tests__/cockpitTurnProgress.test.ts)" = 648aa0a637d82a6d5535e93e2545ef0376ea92bf
          test "$(git hash-object src/engine/cockpitTable.ts)" = ed6116e4506619b6b0401b0cc4a7ec30f002c390
          test "$(git hash-object src/online/cloudflare/__tests__/cockpitSession.test.ts)" = 9c6d4e78c4f7e1b8810d4c4b2a426c46b6a4d5c8
          grep -q 'CockpitReplayButton' src/components/game/CockpitSessionScreen.tsx
          grep -q "send({ type: 'phase' })" src/components/game/CockpitSessionScreen.tsx
          grep -q "type: 'phase', manual: true" src/components/game/CockpitSessionScreen.tsx
          echo "session_sha=$(git hash-object src/components/game/CockpitSessionScreen.tsx)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Stage 2B core regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project core
          src/engine/__tests__/cockpitTurnProgress.test.ts
          src/engine/__tests__/cockpitBattle.test.ts
          src/engine/__tests__/cockpitMana.test.ts
          src/engine/__tests__/cockpitTriggerFacts.test.ts
      - name: Stage 2B DOM and SQLite regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/components/game/CockpitTableSurface.test.tsx
          src/online/cloudflare/__tests__/cockpitSession.test.ts
      - name: Types build and changed-file lint
        run: |
          npm run build
          node node_modules/eslint/bin/eslint.js \
            src/engine/cockpitTable.ts \
            src/engine/__tests__/cockpitTurnProgress.test.ts \
            src/engine/__tests__/cockpitBattle.test.ts \
            src/engine/__tests__/cockpitMana.test.ts \
            src/engine/__tests__/cockpitTriggerFacts.test.ts \
            src/components/game/CockpitCleanupTools.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitTableSurface.test.tsx \
            src/online/cloudflare/__tests__/cockpitSession.test.ts \
            scripts/online/cockpit-turn-evidence.mjs
      - name: Commit validated product tree without temporary workflow or payload
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/stage2b-patch.part1 .github/stage2b-patch.part2 .github/stage2b-patch.part3 .github/stage2b-patch.part4 .github/workflows/cockpit-stage2b-assemble-temp.yml
          git add docs/cockpit-turn-stage2b-2026-09-14.md scripts/online/cockpit-turn-evidence.mjs src
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'staging: assemble validated stage 2B turn and cleanup changes'
          git push origin HEAD:refs/heads/fix/cockpit-stage2b-assemble-20260914
