name: R4b final normal raw zero
on:
  push:
    branches: [r4b-mutation-gate-correction]
permissions:
  contents: write
jobs:
  close-normal-raw:
    if: contains(github.event.head_commit.message, 'stage final normal raw zero')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Close Normal raw mutation entrances
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Transport: all effect operations with an exact Resolution Context use v2.
          # Unbound effects outside the Manual Event allowlist fail closed instead of
          # silently falling back to the legacy commit path.
          replace_once(
              'src/online/browser/cockpitClient.ts',
              """      if (gate.kind === 'effect' && gate.manualEventCapable) {\n        await this.commitV2(\n          r4bOperation,\n          context,\n          context.kind === 'unbound' ? { kind: 'manual-event' } : undefined,\n        );\n        return;\n      }\n""",
              """      if (gate.kind === 'effect') {\n        if (context.kind === 'resolution') {\n          await this.commitV2(r4bOperation, context);\n          return;\n        }\n        if (gate.manualEventCapable) {\n          await this.commitV2(r4bOperation, context, { kind: 'manual-event' });\n          return;\n        }\n        throw new CockpitConnectionError(\n          'この操作は解決処理中だけ利用できます。通常盤面ではManual EventまたはCorrectionを選んでください。',\n          'R4B_RESOLUTION_REQUIRED',\n        );\n      }\n""",
          )

          # Selection tools: these effect families are Resolution-only in R4b v1.
          replace_once(
              'src/components/game/CockpitSelectionTools.tsx',
              """          <button\n            key={kind}\n            disabled={disabled || count < 1 || libraryStatus === 'loading'}\n""",
              """          <button\n            key={kind}\n            hidden={!table.resolution}\n            disabled={disabled || count < 1 || libraryStatus === 'loading'}\n""",
          )
          replace_once(
              'src/components/game/CockpitSelectionTools.tsx',
              """        <button\n          disabled={disabled}\n          onClick={() => void send({ type: 'shuffle', seatId, seed: randomSeed() })}\n""",
              """        <button\n          hidden={!table.resolution}\n          disabled={disabled}\n          onClick={() => void send({ type: 'shuffle', seatId, seed: randomSeed() })}\n""",
          )
          replace_once(
              'src/components/game/CockpitSelectionTools.tsx',
              """        <button\n          disabled={disabled || count < 1 || count > seat.zones.hand.length}\n          onClick={() => void send({ type: 'randomDiscard', seatId, count, seed: randomSeed() })}\n""",
              """        <button\n          hidden={!table.resolution}\n          disabled={disabled || count < 1 || count > seat.zones.hand.length}\n          onClick={() => void send({ type: 'randomDiscard', seatId, count, seed: randomSeed() })}\n""",
          )
          replace_once(
              'src/components/game/CockpitSelectionTools.tsx',
              """        <button\n          disabled={disabled}\n          onClick={() =>\n            setProliferate({ ids: [], context: captureExpectedInteractionContext(table) })\n          }\n""",
              """        <button\n          hidden={!table.resolution}\n          disabled={disabled}\n          onClick={() =>\n            setProliferate({ ids: [], context: captureExpectedInteractionContext(table) })\n          }\n""",
          )
          replace_once(
              'src/components/game/CockpitSelectionTools.tsx',
              """        <button disabled={disabled} onClick={browseLibrary}>\n          山札から探す\n        </button>\n""",
              """        <button disabled={disabled} onClick={browseLibrary}>\n          山札から探す\n        </button>\n        {!table.resolution && (\n          <p>占術・諜報・シャッフル・ランダムDiscard・増殖は現在のResolution中だけ利用できます。</p>\n        )}\n""",
          )

          # Session surface: legacy raw helpers are not Normal actions.
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """            <details>\n              <summary>マナの調整</summary>\n""",
              """            <details hidden={!table.resolution}>\n              <summary>マナの調整（Resolution）</summary>\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """              <button\n                disabled={disabled}\n                onClick={() => void send({ type: 'emptyMana', seatIds: [seatId] })}\n""",
              """              <button\n                hidden={!table.resolution}\n                disabled={disabled}\n                onClick={() => void send({ type: 'emptyMana', seatIds: [seatId] })}\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """            <CockpitTokenTools\n              table={table}\n              seatId={seatId}\n              selected={selected}\n              disabled={disabled}\n              send={send}\n            />\n""",
              """            <div hidden={!table.resolution}>\n              <CockpitTokenTools\n                table={table}\n                seatId={seatId}\n                selected={selected}\n                disabled={disabled}\n                send={send}\n              />\n            </div>\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """          <CockpitCardTools\n            key={detailCard.id}\n            table={table}\n            cardId={detailCard.id}\n            disabled={disabled}\n            send={send}\n          />\n""",
              """          {!table.resolution &&\n            detailCard.zone === 'battlefield' &&\n            detailCard.faceDown && (\n              <button\n                disabled={disabled}\n                onClick={() =>\n                  void send({\n                    type: 'special.turnFaceUp',\n                    cardId: detailCard.id,\n                    faceIndex: detailCard.faceIndex,\n                  })\n                }\n              >\n                表向きにする\n              </button>\n            )}\n          <div hidden={!table.resolution}>\n            <CockpitCardTools\n              key={detailCard.id}\n              table={table}\n              cardId={detailCard.id}\n              disabled={disabled}\n              send={send}\n            />\n          </div>\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """          {detailCard.zone === 'battlefield' && (\n            <button\n              disabled={disabled || (!!attachment && attachment.source !== detailCard.id)}\n              onClick={() => chooseAttachment(detailCard.id)}\n""",
              """          {detailCard.zone === 'battlefield' && (\n            <button\n              hidden={!table.resolution}\n              disabled={disabled || (!!attachment && attachment.source !== detailCard.id)}\n              onClick={() => chooseAttachment(detailCard.id)}\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """                <button\n                  disabled={disabled || (!!attachment && attachment.source !== card.id)}\n                  onClick={() => chooseAttachment(card.id)}\n""",
              """                <button\n                  hidden={!table.resolution}\n                  disabled={disabled || (!!attachment && attachment.source !== card.id)}\n                  onClick={() => chooseAttachment(card.id)}\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """                <button\n                  disabled={disabled}\n                  onClick={() => void send({ type: 'attach', cardId: card.id, targetId: null })}\n""",
              """                <button\n                  hidden={!table.resolution}\n                  disabled={disabled}\n                  onClick={() => void send({ type: 'attach', cardId: card.id, targetId: null })}\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """              <button\n                disabled={\n                  disabled ||\n                  attachment.paused ||\n""",
              """              <button\n                hidden={!table.resolution}\n                disabled={\n                  disabled ||\n                  attachment.paused ||\n""",
          )
          replace_once(
              'src/components/game/CockpitSessionScreen.tsx',
              """              <details>\n                <summary>キーワードを付与・解除</summary>\n""",
              """              <details hidden={!table.resolution}>\n                <summary>キーワードを付与・解除（Resolution）</summary>\n""",
          )

          # Correction gains absolute mana, commander-count and publication-state repair.
          replace_once(
              'src/components/game/CockpitCorrectionTools.tsx',
              "import { tableZones, type CockpitTable } from '../../engine/cockpitTable';",
              "import { manaColors, tableZones, type CockpitTable } from '../../engine/cockpitTable';",
          )
          replace_once(
              'src/components/game/CockpitCorrectionTools.tsx',
              "import { objectIdOf, type ZoneId } from '../../engine/types';",
              "import { objectIdOf, type ManaPool, type ZoneId } from '../../engine/types';",
          )
          replace_once(
              'src/components/game/CockpitCorrectionTools.tsx',
              """  damageMarked: number;\n  deathtouchDamage: boolean;\n}""",
              """  damageMarked: number;\n  deathtouchDamage: boolean;\n  mana: ManaPool;\n  commanderCount: number;\n  visibilitySeatIds: string[];\n}""",
          )
          replace_once(
              'src/components/game/CockpitCorrectionTools.tsx',
              """  const oneBattlefield =\n    draft?.objects.length === 1 && cards[0]?.zone === 'battlefield' ? draft.objects[0] : null;\n""",
              """  const oneObject = draft?.objects.length === 1 ? draft.objects[0] : null;\n  const oneBattlefield = oneObject && cards[0]?.zone === 'battlefield' ? oneObject : null;\n""",
          )
          replace_once(
              'src/components/game/CockpitCorrectionTools.tsx',
              """      damageMarked: first?.damageMarked ?? 0,\n      deathtouchDamage: first?.hasDeathtouchDamage ?? false,\n""",
              """      damageMarked: first?.damageMarked ?? 0,\n      deathtouchDamage: first?.hasDeathtouchDamage ?? false,\n      mana: { ...seat.mana },\n      commanderCount: first ? (table.commanderCasts[first.id] ?? 0) : 0,\n      visibilitySeatIds: first ? [...(table.visibility[first.id] ?? [])] : [],\n""",
          )
          marker = "          <p>既に引いたカードの所在違いは「所在を訂正」で手札へ移します。新しく1枚引く操作はManual Eventです。</p>"
          addition = """          <fieldset>\n            <legend>マナプールを訂正</legend>\n            {manaColors.map((color) => (\n              <label key={color}>\n                {color}\n                <input\n                  type=\"number\"\n                  min=\"0\"\n                  value={draft.mana[color]}\n                  onChange={(event) =>\n                    setDraft({\n                      ...draft,\n                      mana: { ...draft.mana, [color]: Number(event.target.value) },\n                    })\n                  }\n                />\n              </label>\n            ))}\n            <button\n              disabled={correctionUnavailable}\n              onClick={() => void repair({ type: 'repair.manaPool', seatId, value: draft.mana })}\n            >\n              マナプールを訂正\n            </button>\n          </fieldset>\n\n          {oneObject && table.cards[oneObject.cardId]?.isCommander && (\n            <fieldset>\n              <legend>統率者の唱えた回数を訂正</legend>\n              <input\n                type=\"number\"\n                min=\"0\"\n                value={draft.commanderCount}\n                onChange={(event) =>\n                  setDraft({ ...draft, commanderCount: Number(event.target.value) })\n                }\n              />\n              <button\n                disabled={correctionUnavailable}\n                onClick={() =>\n                  void repair({\n                    type: 'repair.commanderCount',\n                    cardId: oneObject.cardId,\n                    value: draft.commanderCount,\n                  })\n                }\n              >\n                統率者カウントを訂正\n              </button>\n            </fieldset>\n          )}\n\n          {oneObject && (\n            <fieldset>\n              <legend>公開状態を訂正</legend>\n              {table.seats.map((targetSeat) => (\n                <label key={targetSeat.id}>\n                  <input\n                    type=\"checkbox\"\n                    checked={draft.visibilitySeatIds.includes(targetSeat.id)}\n                    onChange={(event) =>\n                      setDraft({\n                        ...draft,\n                        visibilitySeatIds: event.target.checked\n                          ? [...draft.visibilitySeatIds, targetSeat.id]\n                          : draft.visibilitySeatIds.filter((id) => id !== targetSeat.id),\n                      })\n                    }\n                  />\n                  {targetSeat.label}\n                </label>\n              ))}\n              <button\n                disabled={correctionUnavailable}\n                onClick={() =>\n                  void repair({\n                    type: 'repair.visibility',\n                    object: oneObject,\n                    seatIds: draft.visibilitySeatIds,\n                  })\n                }\n              >\n                公開状態を訂正\n              </button>\n            </fieldset>\n          )}\n\n""" + marker
          replace_once('src/components/game/CockpitCorrectionTools.tsx', marker, addition)

          # Browser transport regression: Resolution-only effect must never fall back to legacy in Normal.
          test_path = Path('src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts')
          test = test_path.read_text()
          test += """\n\nit('rejects a Normal resolution-only effect before any legacy commit is sent', async () => {\n  connectState();\n  const requests: Record<string, unknown>[] = [];\n  vi.stubGlobal(\n    'fetch',\n    vi.fn((_url: string, init: RequestInit) => {\n      const body = JSON.parse(init.body as string) as Record<string, unknown>;\n      requests.push(body);\n      return Promise.resolve(\n        Response.json({\n          table: { seats: [] },\n          revision: 0,\n          receipt: 'committed',\n          canUndo: false,\n          canRedo: false,\n          expiresAt: 0,\n          recentActions: [],\n        }),\n      );\n    }),\n  );\n  const client = new CockpitClient(vi.fn());\n  clients.push(client);\n  await client.reconnect();\n  await expect(\n    client.commit({ type: 'mana', seatId: 'P1', color: 'G', delta: 1 }, { kind: 'unbound' }),\n  ).rejects.toThrow('解決処理中だけ');\n  expect(requests.filter((body) => body.type === 'commit')).toHaveLength(0);\n});\n\nit('routes the same resolution-only effect through protocol v2 while resolving', async () => {\n  connectState();\n  const requests: Record<string, unknown>[] = [];\n  let revision = 0;\n  vi.stubGlobal(\n    'fetch',\n    vi.fn((_url: string, init: RequestInit) => {\n      const body = JSON.parse(init.body as string) as Record<string, unknown>;\n      requests.push(body);\n      if (body.type === 'commit') revision += 1;\n      return Promise.resolve(\n        Response.json({\n          table: { seats: [] },\n          revision,\n          receipt: 'committed',\n          canUndo: false,\n          canRedo: false,\n          expiresAt: 0,\n          recentActions: [],\n        }),\n      );\n    }),\n  );\n  const client = new CockpitClient(vi.fn());\n  clients.push(client);\n  await client.reconnect();\n  await client.commit(\n    { type: 'mana', seatId: 'P1', color: 'G', delta: 1 },\n    { kind: 'resolution', entryId: 'stack-1' },\n  );\n  const commit = requests.find((body) => body.type === 'commit')!;\n  expect(commit).toMatchObject({\n    protocolVersion: 2,\n    context: { kind: 'resolution', entryId: 'stack-1' },\n    operation: { type: 'mana', seatId: 'P1', color: 'G', delta: 1 },\n  });\n  expect(commit).not.toHaveProperty('declaredCause');\n});\n"""
          test_path.write_text(test)

          # Static UI contract regression: every known Resolution-only Normal surface is gated.
          Path('src/components/game/CockpitNormalRawZero.r4b.test.ts').write_text("""import { readFileSync } from 'node:fs';\nimport { expect, it } from 'vitest';\n\nconst read = (path: string) => readFileSync(path, 'utf8');\n\nit('keeps resolution-only raw mutation controls out of Normal UI', () => {\n  const session = read('src/components/game/CockpitSessionScreen.tsx');\n  const selection = read('src/components/game/CockpitSelectionTools.tsx');\n  expect(session).toContain('<details hidden={!table.resolution}>\\n              <summary>マナの調整（Resolution）</summary>');\n  expect(session).toContain('hidden={!table.resolution}\\n                disabled={disabled}\\n                onClick={() => void send({ type: \'emptyMana\'');\n  expect(session).toContain('<div hidden={!table.resolution}>\\n              <CockpitTokenTools');\n  expect(session).toContain('<div hidden={!table.resolution}>\\n            <CockpitCardTools');\n  expect(session).toContain('<details hidden={!table.resolution}>\\n                <summary>キーワードを付与・解除（Resolution）</summary>');\n  expect(selection).toContain('key={kind}\\n            hidden={!table.resolution}');\n  expect(selection).toContain("hidden={!table.resolution}\\n          disabled={disabled}\\n          onClick={() => void send({ type: 'shuffle'");\n  expect(selection).toContain("hidden={!table.resolution}\\n          disabled={disabled || count < 1 || count > seat.zones.hand.length}");\n  expect(selection).toContain('hidden={!table.resolution}\\n          disabled={disabled}\\n          onClick={() =>\\n            setProliferate');\n});\n""")

          # Dedicated verification covers the new UI guard and source files.
          workflow = Path('.github/workflows/r4b-verification.yml')
          w = workflow.read_text()
          w = w.replace(
              '          src/components/game/CockpitCorrectionTools.r4b.test.tsx\n',
              '          src/components/game/CockpitCorrectionTools.r4b.test.tsx\n          src/components/game/CockpitNormalRawZero.r4b.test.ts\n',
              1,
          )
          w = w.replace(
              '          src/components/game/CockpitCorrectionTools.r4b.test.tsx\n          src/components/game/CockpitSelectionTools.tsx\n',
              '          src/components/game/CockpitCorrectionTools.r4b.test.tsx\n          src/components/game/CockpitNormalRawZero.r4b.test.ts\n          src/components/game/CockpitSelectionTools.tsx\n',
              1,
          )
          workflow.write_text(w)
          PY
      - name: Targeted R4b UI regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts
          src/components/game/CockpitCorrectionTools.r4b.test.tsx
          src/components/game/CockpitNormalRawZero.r4b.test.ts
      - name: Types and build
        run: npm run build
      - name: Lint changed R4b UI
        run: >-
          node node_modules/eslint/bin/eslint.js
          src/online/browser/cockpitClient.ts
          src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts
          src/components/game/CockpitSelectionTools.tsx
          src/components/game/CockpitSessionScreen.tsx
          src/components/game/CockpitCorrectionTools.tsx
          src/components/game/CockpitNormalRawZero.r4b.test.ts
      - name: Commit final Normal ingress closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/online/browser/cockpitClient.ts \
                  src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts \
                  src/components/game/CockpitSelectionTools.tsx \
                  src/components/game/CockpitSessionScreen.tsx \
                  src/components/game/CockpitCorrectionTools.tsx \
                  src/components/game/CockpitNormalRawZero.r4b.test.ts \
                  .github/workflows/r4b-verification.yml
          git commit -m 'fix(r4b): close Normal raw mutation entrances'
          git push origin HEAD:r4b-mutation-gate-correction
