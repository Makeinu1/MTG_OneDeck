name: R4 manual trigger migration
on:
  push:
    branches: [r4a-formal-manual-inventory]
    paths: [.github/r4-manual-trigger.marker]
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact R4 manual Trigger migration
        run: python scripts/r4-manual-trigger-migration.py
      - name: Keep generated UI assertion type-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/game/CockpitAbilityTools.manualTrigger.test.tsx')
          text = path.read_text()
          old = "    expect(send.mock.calls[0][0]).not.toHaveProperty('choice', 'triggered');\n"
          new = """    expect(send).not.toHaveBeenCalledWith(\n      expect.objectContaining({ type: 'activate', choice: 'triggered' }),\n    );\n"""
          if text.count(old) != 1:
              raise SystemExit('generated manual Trigger assertion changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Engine lifecycle test
        run: >-
          node node_modules/vitest/vitest.mjs run --project core
          src/engine/__tests__/cockpitR4ManualTrigger.test.ts
          src/engine/__tests__/cockpitR4.test.ts
          src/engine/__tests__/cockpitR31.test.ts
      - name: Server and UI tests
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/online/cloudflare/__tests__/cockpitR4ManualTriggerSession.test.ts
          src/online/cloudflare/__tests__/cockpitR4ActivateSession.test.ts
          src/components/game/CockpitAbilityTools.manualTrigger.test.tsx
          src/components/game/CockpitAbilityTools.test.tsx
      - name: Types and build
        run: npm run build
      - name: Lint changed source
        run: >-
          node node_modules/eslint/bin/eslint.js
          src/engine/cockpitTriggers.ts
          src/engine/cockpitR4.ts
          src/engine/__tests__/cockpitR4ManualTrigger.test.ts
          src/online/cloudflare/cockpitR4Authority.ts
          src/online/cloudflare/__tests__/cockpitR4ManualTriggerSession.test.ts
          src/components/game/CockpitAbilityTools.tsx
          src/components/game/CockpitAbilityTools.manualTrigger.test.tsx
      - run: git diff --check
      - name: Commit verified source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/engine/cockpitTriggers.ts \
            src/engine/cockpitR4.ts \
            src/engine/__tests__/cockpitR4ManualTrigger.test.ts \
            src/online/cloudflare/cockpitR4Authority.ts \
            src/online/cloudflare/__tests__/cockpitR4ManualTriggerSession.test.ts \
            src/components/game/CockpitAbilityTools.tsx \
            src/components/game/CockpitAbilityTools.manualTrigger.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(r4): route manual triggers through pending lifecycle"
          git push origin HEAD:r4a-formal-manual-inventory
