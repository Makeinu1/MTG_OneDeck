name: M5 one-shot branch retirement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m5-branch-retirement.yml

permissions:
  contents: write

concurrency:
  group: m5-one-shot-branch-retirement
  cancel-in-progress: false

jobs:
  retire:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact audited refs before any deletion
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m5-retire-specs.txt" <<'EOF'
          a3-repair-stack-target-lki|8889f3fb01e936774f5aeff7667d1b4f230b364b
          chore/cloudflare-worker-deploy-20260915|ec67dfe4afc3296b9e93def381e15f469e19088a
