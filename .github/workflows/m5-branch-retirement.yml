          r6-ux-constitution|5baf505665b071fad6b3f67c34f2116781fee4a5
          r6-ux-constitution-safety-backup|299459531189eb124e05b9dca5ae6f8890aed390
          r31-manual-resolution-lifecycle|273ed024b468897508318557dfabec6f75b929b1
          sync-main-into-r5a1-20260917b|95ede33a503ec25d0d2370efb064bf199d40bff4
          sync-main-into-r5a1-20260917c|95ede33a503ec25d0d2370efb064bf199d40bff4
          sync-main-into-r5a1-20260917|95ede33a503ec25d0d2370efb064bf199d40bff4
          EOF
          delete_args=()
          while IFS='|' read -r branch expected; do
            test -n "$branch"
            current="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ "$current" != "$expected" ]; then
              echo "Ref drift: $branch expected=$expected current=${current:-MISSING}" >&2
              exit 1
            fi
            delete_args+=("$branch")
          done < "$RUNNER_TEMP/m5-retire-specs.txt"

          self_branch="m5-2-residue-cleanup"
          self_sha="$(git ls-remote --heads origin "refs/heads/$self_branch" | awk '{print $1}')"
          test -n "$self_sha"
          git merge-base --is-ancestor "$self_sha" "${{ github.sha }}"
          delete_args+=("$self_branch")

          printf '%s\n' "${delete_args[@]}" > "$RUNNER_TEMP/m5-retire-verified.txt"
      - name: Atomically retire verified non-main branch refs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < "$RUNNER_TEMP/m5-retire-verified.txt"
          test "${#branches[@]}" -gt 0
          git push --atomic origin --delete "${branches[@]}"
      - name: Prove only main remains from the audited set
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch _; do
            test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          done < "$RUNNER_TEMP/m5-retire-specs.txt"
          test -z "$(git ls-remote --heads origin refs/heads/m5-2-residue-cleanup)"
