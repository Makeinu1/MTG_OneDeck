          m0-authority-reconciliation|a31523e9b3bc10082702e555ed8d9d4b6d970082
          m1-1-canonical-state-hardening|6504ca7c1f38652153acc4b6b62028c6450ed023
          m1-canonical-project-state|058f99bd774a03659a0842caabbfc7a6e0e0f55b
          m1-closeout-project-state|391926b5ed126e790aea7aa8b1dd0ffad975527f
          m2-contract-architecture-implementation|b07eebed504ec3b20d0a42786dbde47d83612016
          m2-contract-architecture-plan|c472007343327f56b4aba5011f0b1bccffab42ba
