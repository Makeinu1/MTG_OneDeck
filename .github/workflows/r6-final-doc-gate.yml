name: R6 final docs gate
on:
  push:
    branches: [r6-ux-constitution]
    paths:
      - .github/workflows/r6-final-doc-gate.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Documentation evidence graph gate
        run: node scripts/checks/check-docs.mjs
      - name: Generated engine API check
        run: node scripts/checks/generate-engine-api.mjs --check
# one-shot rerun after acceptance repin
