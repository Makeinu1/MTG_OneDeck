name: R4 Vitest diagnostic

on:
  push:
    branches: [r4a-formal-manual-inventory]
    paths: [.github/r4-vitest-diagnostic.marker]

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: core
        name: Vitest core
        continue-on-error: true
        run: ./node_modules/.bin/vitest run --project core
      - id: dom
        name: Vitest dom
        continue-on-error: true
        run: ./node_modules/.bin/vitest run --project dom
      - name: Report project outcomes
        if: always()
        run: |
          echo "core=${{ steps.core.outcome }}"
          echo "dom=${{ steps.dom.outcome }}"
          test "${{ steps.core.outcome }}" = success
          test "${{ steps.dom.outcome }}" = success
