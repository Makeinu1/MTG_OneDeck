name: R5a-1 verification

on:
  push:
    branches:
      - r5a-1-trigger-occurrence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: R5a-1 targeted occurrence tests
        run: >-
          node node_modules/vitest/vitest.mjs run --project core
          src/engine/__tests__/triggerOccurrence.test.ts
          src/engine/__tests__/triggerOccurrenceCollector.test.ts
          src/engine/__tests__/cockpitTriggerOccurrence.test.ts
          src/engine/__tests__/cockpitTriggerOccurrenceLifecycle.test.ts
      - name: Existing Trigger and Cockpit regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project core
          src/engine/__tests__/cockpitTriggers.test.ts
          src/engine/__tests__/cockpitR31.test.ts
          src/engine/__tests__/cockpitR31Lifecycle.test.ts
          src/engine/__tests__/cockpitR4.test.ts
          src/engine/__tests__/cockpitR4b.test.ts
      - name: Types and build
        run: npm run build
      - name: Synchronize generated engine API
        if: github.event_name == 'push'
        run: |
          node scripts/checks/generate-engine-api.mjs
          if ! git diff --quiet -- docs/generated/engine-api.md; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/generated/engine-api.md
            git commit -m "docs(r5a-1): sync generated engine API"
            git push origin HEAD:r5a-1-trigger-occurrence
            echo "Generated API synchronized; a new verification run will validate the committed head."
            exit 0
          fi
      - name: Changed-file lint and broader domain checks
        run: npm run check:fast -- --base origin/main --head HEAD
