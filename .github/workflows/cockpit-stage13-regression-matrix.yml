name: Cockpit stage 13 regression matrix
on:
  push:
    branches: [fix/cockpit-stage13-regression-matrix-20260915]
permissions:
  contents: write
jobs:
  stage13:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply stage 13 regression additions
        run: python scripts/stage13_transform.py
      - run: npm ci
      - name: Migration matrix regressions
        run: node node_modules/vitest/vitest.mjs run src/engine/__tests__/cockpitMigration.test.ts
      - name: Existing turn and trigger regressions
        run: node node_modules/vitest/vitest.mjs run src/engine/__tests__/cockpitTurnProgress.test.ts src/engine/__tests__/cockpitTriggerFacts.test.ts
      - name: SQLite elimination and mana regressions
        run: node node_modules/vitest/vitest.mjs run src/online/cloudflare/__tests__/cockpitSession.test.ts
      - name: Build, lint, and diff check
        shell: bash
        run: |
          npm run build
          node node_modules/eslint/bin/eslint.js src/engine/__tests__/cockpitMigration.test.ts src/online/cloudflare/__tests__/cockpitSession.test.ts
          git diff --check
      - name: Commit validated tree without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cockpit-stage13-regression-matrix.yml scripts/stage13_transform.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: lock migration and elimination mana boundaries"
          git push origin HEAD:${GITHUB_REF_NAME}
