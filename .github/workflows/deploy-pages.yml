name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: release-base
        name: Resolve last successful Pages SHA
        uses: actions/github-script@v8
        with:
          script: |
            const EMPTY_TREE = '4b825dc642cb6eb9a060e54bf8d69288fbee4904';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              branch: 'main',
              status: 'success',
              per_page: 20,
            });
            const prior = data.workflow_runs.find((run) => run.head_sha !== context.sha);
            const base = prior?.head_sha ?? EMPTY_TREE;
            core.info(`release base ${base} (${prior ? 'last-successful-pages' : 'empty-tree'})`);
            core.setOutput('base', base);
      - name: Cumulative release verification
        run: npm run check:release -- --base "${{ steps.release-base.outputs.base }}" --head "${{ github.sha }}" --build-base=/MTG_OneDeck/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
