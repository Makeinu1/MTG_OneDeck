name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-worker.yml'
      - '*.jsonc'
      - 'scripts/checks/release-check.mjs'
      - 'scripts/checks/resolve-diff-base.mjs'
      - 'scripts/checks/forbidden-files.mjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: diff-base
        name: Resolve cumulative release base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/checks/resolve-diff-base.mjs --before "${{ github.event.before }}" --head "${{ github.sha }}" >/dev/null && BASE="$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/runs?branch=main&status=success&per_page=20" --jq '[.workflow_runs[] | select(.event == "push")][0].head_sha // ""')" && if [ -z "$BASE" ]; then BASE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"; fi && printf 'base=%s\n' "$BASE" >> "$GITHUB_OUTPUT"
      - run: npm run check:release -- --base "${{ steps.diff-base.outputs.base }}" --head "${{ github.sha }}" --build-base=/MTG_OneDeck/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
