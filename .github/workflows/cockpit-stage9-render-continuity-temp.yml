name: Validate stage 9 render continuity
on:
  push:
    branches: [fix/cockpit-render-continuity-stage9-20260914]
permissions:
  contents: read
jobs:
  validate-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify PR base and apply isolated stage 9 transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 37c097624735b30594c4a5bbf9e46a377f9d7b02)" = 37c097624735b30594c4a5bbf9e46a377f9d7b02
          test "$(git hash-object src/components/game/CockpitTableSurface.tsx)" = 34ce5a26a26b146cf49b42166f0def4fc615b575
          test "$(git hash-object src/components/game/CockpitRoomControls.tsx)" = 25fb0a214ed51753e46a4f787f23a0d03c5acfa3
          test "$(git hash-object src/components/game/CockpitBattleTools.tsx)" = 2616c3aa8153e4339c2fef7fda5dd6679dd59d36
          test "$(git hash-object src/engine/__tests__/cockpitBattle.test.ts)" = 3309a2c95ac024355106fad9cae8af1f1bf60209
          python .github/stage9-render-continuity.py
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Format stage 9 product and regressions
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          src/components/game/CockpitTableSurface.tsx
          src/components/game/CockpitRoomControls.tsx
          src/components/game/CockpitEliminationContinuity.test.tsx
          src/components/game/CockpitBattleContinuity.test.tsx
      - name: Dedicated issue 13 DOM regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/components/game/CockpitEliminationContinuity.test.tsx
          src/components/game/CockpitBattleContinuity.test.tsx
          src/components/game/CockpitSelectionToolsLibrary.test.tsx
      - name: Dedicated issue 13 engine combat regression
        run: >-
          node node_modules/vitest/vitest.mjs run --project core
          src/engine/__tests__/cockpitBattle.test.ts
      - name: Neighboring table, room and projection regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/components/game/CockpitTableSurface.test.tsx
          src/components/game/CockpitRoomExpiry.test.tsx
          src/online/cloudflare/__tests__/cockpitLibraryPeekSession.test.ts
          src/online/cloudflare/__tests__/cockpitProjection.test.ts
          src/online/cloudflare/__tests__/cockpitSession.test.ts
      - name: Build and changed-file lint
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node node_modules/eslint/bin/eslint.js \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitRoomControls.tsx \
            src/components/game/CockpitEliminationContinuity.test.tsx \
            src/components/game/CockpitBattleContinuity.test.tsx
          git diff --check
      - name: Commit only the validated product and regression tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/stage9-render-continuity.py .github/workflows/cockpit-stage9-render-continuity-temp.yml
          git add \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitRoomControls.tsx \
            src/components/game/CockpitEliminationContinuity.test.tsx \
            src/components/game/CockpitBattleContinuity.test.tsx
          test -z "$(git status --porcelain | grep '^??' || true)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'staging: validate issue 13 render continuity'
          git push origin HEAD:refs/heads/fix/cockpit-render-continuity-stage9-20260914
