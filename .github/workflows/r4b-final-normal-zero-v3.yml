name: R4b final normal raw zero v3
on:
  push:
    branches: [r4b-mutation-gate-correction]
permissions:
  contents: write
jobs:
  close-normal-raw:
    if: contains(github.event.head_commit.message, 'trigger final normal raw zero v3')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply audited patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/r4b-final-normal-zero.yml').read_text()
          start = source.index('          from pathlib import Path\n')
          end = source.index('          PY\n      - name: Targeted R4b UI regressions', start)
          code = '\n'.join(line[10:] for line in source[start:end].splitlines())
          exec(compile(code, 'r4b-final-normal-zero-extracted.py', 'exec'), {})
          p = Path('src/online/browser/cockpitClient.ts')
          text = p.read_text()
          needle = "      const gate = classifyR4bOperation(r4bOperation);\n"
          replacement = needle + "      if (gate.kind === 'retired')\n        throw new CockpitConnectionError(\n          'この旧操作経路は廃止されました。Manual Event、Correction、またはFormal操作を選んでください。',\n          `R4B_OPERATION_RETIRED:${gate.replacement}`,\n        );\n"
          if text.count(needle) != 1:
              raise SystemExit('client gate insertion point changed')
          p.write_text(text.replace(needle, replacement, 1))
          static_test = "import { readFileSync } from 'node:fs';\nimport { expect, it } from 'vitest';\nconst read = (path: string) => readFileSync(path, 'utf8');\nit('keeps resolution-only raw mutation controls out of Normal UI', () => {\n  const session = read('src/components/game/CockpitSessionScreen.tsx');\n  const selection = read('src/components/game/CockpitSelectionTools.tsx');\n  expect(session).toContain('マナの調整（Resolution）');\n  expect(session).toContain('<div hidden={!table.resolution}>\\n              <CockpitTokenTools');\n  expect(session).toContain('<div hidden={!table.resolution}>\\n            <CockpitCardTools');\n  expect(session).toContain('キーワードを付与・解除（Resolution）');\n  expect(session).toContain(\"type: 'emptyMana'\");\n  expect(selection).toContain(\"type: 'shuffle'\");\n  expect(selection).toContain(\"type: 'randomDiscard'\");\n  expect(selection).toContain('setProliferate');\n  expect((session.match(/hidden={!table\\.resolution}/g) ?? []).length).toBeGreaterThanOrEqual(7);\n  expect((selection.match(/hidden={!table\\.resolution}/g) ?? []).length).toBeGreaterThanOrEqual(4);\n});\n"
          Path('src/components/game/CockpitNormalRawZero.r4b.test.ts').write_text(static_test)
          PY
      - name: Targeted regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts
          src/components/game/CockpitCorrectionTools.r4b.test.tsx
          src/components/game/CockpitNormalRawZero.r4b.test.ts
      - name: Types and build
        run: npm run build
      - name: Lint changed R4b UI
        run: >-
          node node_modules/eslint/bin/eslint.js
          src/online/browser/cockpitClient.ts
          src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts
          src/components/game/CockpitSelectionTools.tsx
          src/components/game/CockpitSessionScreen.tsx
          src/components/game/CockpitCorrectionTools.tsx
          src/components/game/CockpitNormalRawZero.r4b.test.ts
      - name: Commit closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/online/browser/cockpitClient.ts src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts src/components/game/CockpitSelectionTools.tsx src/components/game/CockpitSessionScreen.tsx src/components/game/CockpitCorrectionTools.tsx src/components/game/CockpitNormalRawZero.r4b.test.ts
          git commit -m 'fix(r4b): close Normal raw mutation entrances'
          git push origin HEAD:r4b-mutation-gate-correction
