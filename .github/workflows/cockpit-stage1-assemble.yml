name: Assemble stage 1 recovery candidate
on:
  push:
    branches: [fix/cockpit-playflow-17-20260914]
    paths: [.github/stage1-screen.patch]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: apply
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/cockpit-playflow-17-20260914
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object .github/stage1-screen.patch)" = cd9450b848c745464f321af4349ad1b259524f13
          test "$(git hash-object src/components/game/CockpitSessionScreen.tsx)" = 734df479a8228671c9e1d9fd4ce00437340ec159
          git apply --check .github/stage1-screen.patch
          git apply .github/stage1-screen.patch
          test "$(git hash-object src/components/game/CockpitSessionScreen.tsx)" = 849d71a25e6e82466808d5d48b01b163085f58af
          git rm .github/stage1-screen.patch
          git add src/components/game/CockpitSessionScreen.tsx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: connect stage 1 recovery state to the normal Cockpit screen'
          git push origin HEAD:refs/heads/fix/cockpit-playflow-17-20260914
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: assemble
    permissions:
      contents: read
    uses: ./.github/workflows/cockpit-repair-verification.yml
    with:
      source_sha: ${{ needs.assemble.outputs.candidate }}
