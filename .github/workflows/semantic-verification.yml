name: Semantic Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Exact base commit for candidate verification
        required: true
        type: string
      head:
        description: Exact candidate head commit to verify
        required: true
        type: string
      manual_evidence_json:
        description: Candidate-bound manual evidence receipt JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verification binding integrity
        run: npm run check:verification
      - name: Pull request semantic verification
        if: github.event_name == 'pull_request'
        run: npm run verify:semantic -- --base "origin/${{ github.base_ref }}" --head HEAD
      - name: Materialize manual evidence receipt
        if: github.event_name == 'workflow_dispatch'
        env:
          MANUAL_EVIDENCE_JSON: ${{ inputs.manual_evidence_json }}
        run: node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/manual-evidence.json', process.env.MANUAL_EVIDENCE_JSON)"
      - name: Manual semantic verification
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify:semantic -- --base "${{ inputs.base }}" --head "${{ inputs.head }}" --manual-evidence "$RUNNER_TEMP/manual-evidence.json"
      - id: diff-base
        if: github.event_name == 'push'
        run: node scripts/checks/resolve-diff-base.mjs --before "${{ github.event.before }}" --head "${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Main update semantic verification
        if: github.event_name == 'push'
        run: |
          BASE="${{ steps.diff-base.outputs.base }}"
          if [ "$BASE" = "4b825dc642cb6eb9a060e54bf8d69288fbee4904" ]; then
            echo "First-push empty-tree diff: semantic freshness not claimed; structural integrity already checked."
            exit 0
          fi
          npm run verify:semantic -- --base "$BASE" --head "${{ github.sha }}"
