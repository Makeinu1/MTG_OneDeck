name: R4b release ledger repair
on:
  push:
    branches: [fix/r4b-release-ledgers]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate API index and update Cloudflare source ledgers
        run: |
          npm run generate:docs-api
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const files = [
            'scripts/checks/verify-online-cloudflare-runtime-persistence.ts',
            'scripts/checks/verify-online-cloudflare-websocket-recovery.ts',
            'scripts/checks/verify-online-cloudflare-capability-abuse-control.ts',
            'scripts/checks/verify-online-cloudflare-production-gate.ts',
          ];

          const inventoryEntries = [
            "    'src/online/cloudflare/cockpitR4bAudit.ts',",
            "    'src/online/cloudflare/cockpitR4bSession.ts',",
          ];
          const auditImportLines = [
            "    const cockpitR4bAuditImport = normalized(path) === 'src/online/cloudflare/cockpitR4bAudit.ts' &&",
            "      ['../../engine/cockpitTable', '../../engine/cockpitR4b'].includes(specifier);",
          ];
          const sessionImportLines = [
            "    const cockpitR4bSessionImport = normalized(path) === 'src/online/cloudflare/cockpitR4bSession.ts' &&",
            "      ['../../engine/cockpitR31', '../../engine/cockpitR4', '../../engine/cockpitR4b', '../../engine/cockpitTable', '../../engine/cockpitTriggers', '../../engine/types'].includes(specifier);",
          ];

          for (const file of files) {
            const original = readFileSync(file, 'utf8');
            const lines = original.split('\n');

            if (!lines.some((line) => line.trim() === "'src/online/cloudflare/cockpitR4bAudit.ts',")) {
              const authorityIndex = lines.findIndex((line) =>
                line.trim() === "'src/online/cloudflare/cockpitR4Authority.ts',"
              );
              const sessionIndex = lines.findIndex((line) =>
                line.trim() === "'src/online/cloudflare/cockpitSession.ts',"
              );
              if (authorityIndex < 0 || sessionIndex !== authorityIndex + 1) {
                throw new Error(`production inventory position unexpected: ${file}`);
              }
              lines.splice(sessionIndex, 0, ...inventoryEntries);
            }

            let source = lines.join('\n');
            if (!source.includes('const cockpitR4bAuditImport =')) {
              const importLines = source.split('\n');
              const cockpitImportIndex = importLines.findIndex((line) =>
                line.includes('const cockpitImport =')
              );
              const assertionIndex = importLines.findIndex(
                (line, index) => index > cockpitImportIndex && line.trim() === 'assert.equal('
              );
              if (cockpitImportIndex < 0 || assertionIndex < 0) {
                throw new Error(`import allowlist insertion point missing: ${file}`);
              }
              importLines.splice(assertionIndex, 0, ...auditImportLines, ...sessionImportLines);
              source = importLines.join('\n');
            }

            const expressionLines = source.split('\n');
            const expressionIndex = expressionLines.findIndex((line) =>
              line.includes('local || allowedImports.has(specifier) || cockpitImport || cockpitMultiplayerImport || cockpitR4AuthorityImport')
            );
            if (expressionIndex < 0) {
              throw new Error(`import allowlist expression missing: ${file}`);
            }
            expressionLines[expressionIndex] =
              '      local || allowedImports.has(specifier) || cockpitImport || cockpitMultiplayerImport || cockpitR4AuthorityImport || cockpitR4bAuditImport || cockpitR4bSessionImport,';
            writeFileSync(file, expressionLines.join('\n'));
          }
          NODE
      - name: Commit generated ledger repair locally
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated/engine-api.md \
            scripts/checks/verify-online-cloudflare-runtime-persistence.ts \
            scripts/checks/verify-online-cloudflare-websocket-recovery.ts \
            scripts/checks/verify-online-cloudflare-capability-abuse-control.ts \
            scripts/checks/verify-online-cloudflare-production-gate.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ci): sync R4b release ledgers'
          fi
      - name: Verify release gate
        run: npm run check:release -- --base 3465e00cfb2c1bc76c22fc05b624b8a746b4061d --head HEAD --build-base=/MTG_OneDeck/
      - name: Push verified ledger repair
        run: git push
