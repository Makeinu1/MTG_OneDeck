name: R4b release ledger repair
on:
  push:
    branches: [fix/r4b-release-ledgers]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate API index and update Cloudflare source ledgers
        run: |
          npm run generate:docs-api
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = [
            'scripts/checks/verify-online-cloudflare-runtime-persistence.ts',
            'scripts/checks/verify-online-cloudflare-websocket-recovery.ts',
            'scripts/checks/verify-online-cloudflare-capability-abuse-control.ts',
            'scripts/checks/verify-online-cloudflare-production-gate.ts',
          ];
          const oldList = `  'src/online/cloudflare/cockpitMultiplayer.ts',\n  'src/online/cloudflare/cockpitR4Authority.ts',\n  'src/online/cloudflare/cockpitSession.ts',`;
          const newList = `  'src/online/cloudflare/cockpitMultiplayer.ts',\n  'src/online/cloudflare/cockpitR4Authority.ts',\n  'src/online/cloudflare/cockpitR4bAudit.ts',\n  'src/online/cloudflare/cockpitR4bSession.ts',\n  'src/online/cloudflare/cockpitSession.ts',`;
          const oldImport = `    const cockpitImport = normalized(path) === 'src/online/cloudflare/cockpitSession.ts' &&\n      ['../../engine/cockpitTable', '../../engine/cockpitMigration', '../../engine/cockpitR31', '../../engine/cockpitR4', '../../engine/init', '../../data/gameSnapshot'].includes(specifier);`;
          const newImport = `${oldImport}\n    const cockpitR4bAuditImport = normalized(path) === 'src/online/cloudflare/cockpitR4bAudit.ts' &&\n      ['../../engine/cockpitTable', '../../engine/cockpitR4b'].includes(specifier);\n    const cockpitR4bSessionImport = normalized(path) === 'src/online/cloudflare/cockpitR4bSession.ts' &&\n      ['../../engine/cockpitR31', '../../engine/cockpitR4', '../../engine/cockpitR4b', '../../engine/cockpitTable', '../../engine/cockpitTriggers', '../../engine/types'].includes(specifier);`;
          for (const file of files) {
            let source = readFileSync(file, 'utf8');
            if (!source.includes(oldList)) throw new Error(`production ledger anchor missing: ${file}`);
            source = source.replace(oldList, newList);
            if (!source.includes(oldImport)) throw new Error(`import ledger anchor missing: ${file}`);
            source = source.replace(oldImport, newImport);
            source = source.replace(
              `local || allowedImports.has(specifier) || cockpitImport || cockpitMultiplayerImport || cockpitR4AuthorityImport,`,
              `local || allowedImports.has(specifier) || cockpitImport || cockpitMultiplayerImport || cockpitR4AuthorityImport || cockpitR4bAuditImport || cockpitR4bSessionImport,`,
            );
            writeFileSync(file, source);
          }
          NODE
      - name: Verify release gate
        run: npm run check:release -- --base 3465e00cfb2c1bc76c22fc05b624b8a746b4061d --head HEAD --build-base=/MTG_OneDeck/
      - name: Commit generated ledger repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/generated/engine-api.md scripts/checks/verify-online-cloudflare-*.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ci): sync R4b release ledgers'
          git push
