name: R4b UI context hardening once
on:
  push:
    branches: [r4b-mutation-gate-correction]
permissions:
  contents: write
jobs:
  harden:
    if: "${{ github.event.head_commit.message == 'chore(r4b): run UI context hardening' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r4b-mutation-gate-correction
          fetch-depth: 1
      - name: Apply UI context hardening
        run: node scripts/r4b-ui-context-hardening.mjs
      - name: Remove helper
        run: rm scripts/r4b-ui-context-hardening.mjs
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(r4b): preserve drag Context and Correction HOLD gate'
          git push origin HEAD:r4b-mutation-gate-correction
