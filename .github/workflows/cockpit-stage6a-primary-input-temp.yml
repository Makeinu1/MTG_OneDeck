name: Validate stage 6 interaction regressions
on:
  push:
    branches: [fix/cockpit-stage6a-primary-input-20260914-2]
permissions:
  contents: write
jobs:
  validate-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply product transform and remove staging-only inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD bf166bda2c933c42e854355b6ab49793a7749d92)" = bf166bda2c933c42e854355b6ab49793a7749d92
          python3 .github/stage6a-apply.py
          git rm .github/stage6a-apply.py .github/stage6a-primary-input.patch .github/workflows/cockpit-stage6a-primary-input-temp.yml
      - name: Install dependencies
        run: npm ci
      - name: Format changed product files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/components/game/CockpitCardTools.tsx \
            src/components/game/cockpitTransientSelections.ts \
            src/components/game/CockpitPrimaryAction.test.tsx \
            src/components/game/CockpitCardTools.test.tsx \
            src/components/game/cockpitTransientSelections.test.ts \
            src/online/cloudflare/cockpitMultiplayer.ts \
            src/online/cloudflare/__tests__/cockpitTargetLkiRegression.test.ts
      - name: Dedicated and neighboring regression tests
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/components/game/CockpitPrimaryAction.test.tsx
          src/components/game/CockpitCardTools.test.tsx
          src/components/game/cockpitTransientSelections.test.ts
          src/components/game/CockpitTableSurface.test.tsx
          src/online/cloudflare/__tests__/cockpitTargetLkiRegression.test.ts
          src/online/cloudflare/__tests__/cockpitProjection.test.ts
      - name: Build and changed-file lint
        run: |
          npm run build
          node node_modules/eslint/bin/eslint.js \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/components/game/CockpitCardTools.tsx \
            src/components/game/cockpitTransientSelections.ts \
            src/components/game/CockpitPrimaryAction.test.tsx \
            src/components/game/CockpitCardTools.test.tsx \
            src/components/game/cockpitTransientSelections.test.ts \
            src/online/cloudflare/cockpitMultiplayer.ts \
            src/online/cloudflare/__tests__/cockpitTargetLkiRegression.test.ts
          git diff --check
      - name: Commit validated product tree
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/components/game/CockpitTableSurface.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/components/game/CockpitCardTools.tsx \
            src/components/game/cockpitTransientSelections.ts \
            src/components/game/CockpitPrimaryAction.test.tsx \
            src/components/game/CockpitCardTools.test.tsx \
            src/components/game/cockpitTransientSelections.test.ts \
            src/online/cloudflare/cockpitMultiplayer.ts \
            src/online/cloudflare/__tests__/cockpitTargetLkiRegression.test.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'staging: validate primary input, LKI and attachment object version'
          git push origin HEAD:refs/heads/fix/cockpit-stage6a-primary-input-20260914-2
