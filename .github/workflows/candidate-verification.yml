name: Candidate Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candidate-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full release candidate verification
        run: npm run check:release -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --build-base=/MTG_OneDeck/
