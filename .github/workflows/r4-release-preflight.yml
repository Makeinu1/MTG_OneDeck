name: R4 release preflight

on:
  push:
    branches: [r4a-formal-manual-inventory]
    paths: [.github/r4-release-preflight.marker]

permissions:
  contents: write

jobs:
  preflight:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate generated engine API
        run: |
          set -euo pipefail
          npm run generate:docs-api
          git diff --check -- docs/generated/engine-api.md
          if ! git diff --quiet -- docs/generated/engine-api.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/generated/engine-api.md
            git commit -m "docs: refresh generated engine API for R4"
            git push origin HEAD:r4a-formal-manual-inventory
          fi
      - name: Build intended final tree without temporary preflight files
        run: |
          set -euo pipefail
          git config user.name "preflight"
          git config user.email "preflight@example.invalid"
          git rm .github/workflows/r4-release-preflight.yml .github/r4-release-preflight.marker
          git commit -m "temporary local release preflight tree"
      - name: Run production release gate against current main
        run: |
          set -euo pipefail
          BASE="10ec99234b8646a62ccca3376197dc4986b7a6e9"
          HEAD="$(git rev-parse HEAD)"
          npm run check:release -- --base "$BASE" --head "$HEAD" --build-base=/MTG_OneDeck/
