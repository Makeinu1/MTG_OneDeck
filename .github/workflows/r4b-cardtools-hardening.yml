name: R4b card tools hardening
on:
  push:
    branches: [r4b-mutation-gate-correction]
permissions:
  contents: write
jobs:
  harden:
    if: github.repository == 'Makeinu1/MTG_OneDeck' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r4b-mutation-gate-correction
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply remaining R4b Normal UI hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected block in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # 1) Browser boundary: never let Resolution-only/retired operations fall back to legacy commit.
          path = 'src/online/browser/cockpitClient.ts'
          old = '''      if (gate.kind === 'effect' && gate.manualEventCapable) {
        await this.commitV2(
          r4bOperation,
          context,
          context.kind === 'unbound' ? { kind: 'manual-event' } : undefined,
        );
        return;
      }
    }
    await this.submit(operation, false, context);
'''
          new = '''      if (gate.kind === 'effect') {
        if (context.kind === 'resolution') {
          await this.commitV2(r4bOperation, context);
          return;
        }
        if (gate.manualEventCapable) {
          await this.commitV2(r4bOperation, context, { kind: 'manual-event' });
          return;
        }
        throw new CockpitConnectionError(
          'この効果操作はManual Resolution中だけ確定できます。盤面の食い違いはCorrectionを使ってください。',
          'R4B_RESOLUTION_REQUIRED',
        );
      }
      if (gate.kind === 'formal' && gate.family === 'stack-effect') {
        if (context.kind === 'resolution') {
          await this.commitV2(r4bOperation, context);
          return;
        }
        throw new CockpitConnectionError(
          'Stackのコピー・除去は現在の解決処理に結び付けて実行してください。',
          'R4B_STACK_EFFECT_REQUIRES_RESOLUTION',
        );
      }
      if (gate.kind === 'retired')
        throw new CockpitConnectionError(
          'この旧操作経路は廃止されました。Manual ResolutionまたはCorrectionから操作してください。',
          `R4B_OPERATION_RETIRED:${gate.replacement}`,
        );
    }
    await this.submit(operation, false, context);
'''
          replace_once(path, old, new)

          # 2) Production R4b Card/Token tools: Normal has no free effect mutation.
          Path('src/components/game/CockpitR4bCardTools.tsx').write_text(r'''import { useState } from 'react';
import type {
  CockpitTable,
  TableModifier,
  TableTokenCharacteristics,
} from '../../engine/cockpitTable';
import {
  captureExpectedInteractionContext,
  type ExpectedInteractionContext,
} from '../../engine/cockpitR31';
import type { R4bOperation } from '../../engine/cockpitR4b';

type Send = (
  operation: R4bOperation,
  context?: ExpectedInteractionContext,
) => Promise<boolean>;

export function CockpitR4bCardTools({
  table,
  cardId,
  disabled,
  send,
}: {
  table: CockpitTable;
  cardId: string;
  disabled: boolean;
  send: Send;
}) {
  const card = table.cards[cardId];
  const [context] = useState(() => captureExpectedInteractionContext(table));
  const [faceIndex, setFaceIndex] = useState(card.faceIndex);
  const [controllerId, setControllerId] = useState(card.controllerId);
  const [targetId, setTargetId] = useState(card.attachedTo ?? '');
  const [power, setPower] = useState(0);
  const [toughness, setToughness] = useState(0);
  const [duration, setDuration] = useState('ターン終了まで');
  const [sourceId, setSourceId] = useState(table.resolution?.source.id ?? '');
  const resolving = context.kind === 'resolution' && table.resolution?.id === context.entryId;
  const name = (id: string) => {
    const item = table.cards[id];
    const def = item && table.defs[item.defId];
    return def?.printedName ?? def?.name ?? id;
  };
  const apply = (operation: R4bOperation) => resolving ? send(operation, context) : Promise.resolve(false);

  return (
    <details open={Boolean(card.attachedTo)}>
      <summary>状態・修整・取り付け</summary>
      {card.isCommander && (
        <p>
          統率領域から唱えた回数 {table.commanderCasts[cardId] ?? 0} / 次回の統率者税{' '}
          {2 * (table.commanderCasts[cardId] ?? 0)}
        </p>
      )}
      <p>
        カウンター: {Object.entries(card.counters).map(([key, value]) => `${key} ${value}`).join(' / ') || 'なし'} /{' '}
        受けているダメージ {card.damageMarked}
      </p>
      {card.zone === 'battlefield' && card.faceDown && (
        <button
          disabled={disabled}
          onClick={() => void send({ type: 'special.turnFaceUp', cardId, faceIndex }, context)}
        >
          表向きにする（特別な処理）
        </button>
      )}
      {!resolving ? (
        <p role="status">
          効果による面・コントローラー・取り付け・修整・関連の変更はManual Resolution中に行います。既に現実と食い違う状態は「盤面訂正（Correction）」を使ってください。
        </p>
      ) : (
        <fieldset>
          <legend>Manual Resolutionの効果操作</legend>
          <label>
            表示する面{' '}
            <select value={faceIndex} onChange={(event) => setFaceIndex(Number(event.target.value))}>
              {table.defs[card.defId].faces.map((face, index) => (
                <option key={index} value={index}>{face.printedName ?? face.name}</option>
              ))}
            </select>
          </label>
          <button
            disabled={disabled}
            onClick={() => void apply({ type: 'face', cardId, faceIndex, faceDown: card.faceDown })}
          >
            選んだ面へ変更
          </button>
          {!card.faceDown && (
            <button
              disabled={disabled}
              onClick={() => void apply({ type: 'face', cardId, faceIndex: card.faceIndex, faceDown: true })}
            >
              裏向きにする
            </button>
          )}
          {card.zone === 'battlefield' && (
            <>
              <label>
                コントローラー{' '}
                <select value={controllerId} onChange={(event) => setControllerId(event.target.value)}>
                  {table.seats.map((seat) => <option key={seat.id} value={seat.id}>{seat.label}</option>)}
                </select>
              </label>
              <button disabled={disabled} onClick={() => void apply({ type: 'control', ids: [cardId], seatId: controllerId })}>
                コントローラー変更を適用
              </button>
              <label>
                取り付け先{' '}
                <select value={targetId} onChange={(event) => setTargetId(event.target.value)}>
                  <option value="">なし</option>
                  {Object.values(table.cards)
                    .filter((item) => item.zone === 'battlefield' && item.id !== cardId)
                    .map((item) => <option key={item.id} value={item.id}>《{name(item.id)}》</option>)}
                </select>
              </label>
              <button disabled={disabled} onClick={() => void apply({ type: 'attach', cardId, targetId: targetId || null })}>
                取り付け状態を適用
              </button>
              <label>パワー修整 <input type="number" value={power} onChange={(event) => setPower(Number(event.target.value))} /></label>
              <label>タフネス修整 <input type="number" value={toughness} onChange={(event) => setToughness(Number(event.target.value))} /></label>
              <label>期間 <input value={duration} onChange={(event) => setDuration(event.target.value)} /></label>
              <label>
                由来{' '}
                <select value={sourceId} onChange={(event) => setSourceId(event.target.value)}>
                  <option value="">指定なし</option>
                  {Object.keys(table.cards).map((id) => <option key={id} value={id}>《{name(id)}》</option>)}
                </select>
              </label>
              <button
                disabled={disabled}
                onClick={() => void apply({
                  type: 'modifier',
                  modifier: {
                    id: crypto.randomUUID(),
                    cardId,
                    power,
                    toughness,
                    duration,
                    sourceId: sourceId || null,
                  },
                  remove: false,
                })}
              >
                修整を追加
              </button>
              {table.modifiers.filter((item) => item.cardId === cardId).map((item: TableModifier) => (
                <p key={item.id}>
                  {item.power >= 0 ? '+' : ''}{item.power}/{item.toughness >= 0 ? '+' : ''}{item.toughness}・{item.duration}{' '}
                  <button disabled={disabled} onClick={() => void apply({ type: 'modifier', modifier: item, remove: true })}>修整を解除</button>
                </p>
              ))}
            </>
          )}
          {card.zone === 'exile' && (
            <>
              <label>
                追放の発生源{' '}
                <select value={sourceId} onChange={(event) => setSourceId(event.target.value)}>
                  <option value="">選択</option>
                  {Object.keys(table.cards).filter((id) => id !== cardId).map((id) => (
                    <option key={id} value={id}>《{name(id)}》</option>
                  ))}
                </select>
              </label>
              <button
                disabled={disabled || !sourceId}
                onClick={() => void apply({ type: 'link', sourceId, ids: [cardId], duration, remove: false })}
              >
                追放との関連を追加
              </button>
            </>
          )}
        </fieldset>
      )}
    </details>
  );
}

export function CockpitR4bTokenTools({
  table,
  seatId,
  selected,
  disabled,
  send,
}: {
  table: CockpitTable;
  seatId: string;
  selected: string[];
  disabled: boolean;
  send: Send;
}) {
  const [context] = useState(() => captureExpectedInteractionContext(table));
  const [name, setName] = useState('兵士');
  const [typeLine, setTypeLine] = useState('Creature — Soldier');
  const [power, setPower] = useState('1');
  const [toughness, setToughness] = useState('1');
  const [text, setText] = useState('');
  const resolving = context.kind === 'resolution' && table.resolution?.id === context.entryId;
  const source = selected.length === 1 ? table.cards[selected[0]] : null;
  const value: TableTokenCharacteristics = { name, typeLine, power, toughness, text };
  if (!resolving)
    return (
      <details className="cockpit-session__tools">
        <summary>トークン・パーマネントのコピー</summary>
        <p role="status">生成はManual Resolution中の効果操作として行います。既存トークンの状態訂正はCorrectionを使ってください。</p>
      </details>
    );
  return (
    <details className="cockpit-session__tools">
      <summary>トークン・パーマネントのコピーを生成</summary>
      <label>トークン名 <input value={name} onChange={(event) => setName(event.target.value)} /></label>
      <label>タイプ <input value={typeLine} onChange={(event) => setTypeLine(event.target.value)} /></label>
      <label>パワー <input value={power} onChange={(event) => setPower(event.target.value)} /></label>
      <label>タフネス <input value={toughness} onChange={(event) => setToughness(event.target.value)} /></label>
      <label>ルール文 <input value={text} onChange={(event) => setText(event.target.value)} /></label>
      <button
        disabled={disabled || !name.trim() || !typeLine.trim()}
        onClick={() => void send({ type: 'token', id: crypto.randomUUID(), seatId, ...value }, context)}
      >
        この特徴でトークンを生成
      </button>
      <button
        disabled={disabled || source?.zone !== 'battlefield' || source.faceDown}
        onClick={() => source && void send({ type: 'copyPermanent', id: crypto.randomUUID(), seatId, sourceId: source.id }, context)}
      >
        選択した1枚のコピー・トークンを生成
      </button>
    </details>
  );
}
''')

