name: R4b stale test migration
on:
  push:
    branches: [fix/r4b-release-ledgers]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate stale R4b test clients
        run: node .github/scripts/r4b-release-test-migrate.mjs
      - name: Commit migrated tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/game/CockpitPrimaryAction.test.tsx \
            src/components/game/CockpitSelectionToolsLibrary.test.tsx \
            src/online/cloudflare/__tests__/cockpitSession.test.ts \
            src/online/cloudflare/__tests__/cockpitTtlPolicy.test.ts \
            src/online/cloudflare/__tests__/cockpitLibraryPeekSession.test.ts \
            src/online/cloudflare/__tests__/cockpitR4ActivateSession.test.ts \
            src/online/cloudflare/__tests__/cockpitR4EntrySession.test.ts \
            src/online/cloudflare/__tests__/cockpitR4ManualTriggerSession.test.ts \
            src/online/cloudflare/__tests__/cockpitR4StateSession.test.ts
          git commit -m 'test: migrate stale clients to R4b protocol v2'
          git push
