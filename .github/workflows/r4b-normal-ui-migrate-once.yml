name: R4b normal UI migrate once
on:
  push:
    branches: [r4b-mutation-gate-correction]
permissions:
  contents: write
jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'chore(r4b): run normal mutation ui migration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r4b-mutation-gate-correction
          fetch-depth: 1
      - name: Allow sequential identical anchors in migration helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/r4b-normal-ui-migrate.mjs')
          s = p.read_text()
          s = s.replace(
              "  const count = source.split(from).length - 1;\n  if (count !== 1) throw new Error(`${path}: expected one match, got ${count}`);\n  write(path, source.replace(from, to));",
              "  if (!source.includes(from)) throw new Error(`${path}: expected anchor`);\n  write(path, source.replace(from, to));",
          )
          p.write_text(s)
          PY
      - name: Apply R4b Normal mutation UI migration
        run: node scripts/r4b-normal-ui-migrate.mjs
      - name: Remove one-shot migration machinery
        run: rm scripts/r4b-normal-ui-migrate.mjs .github/workflows/r4b-normal-ui-migrate-once.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(r4b): migrate Normal raw mutation UI causes'
          git push origin HEAD:r4b-mutation-gate-correction
