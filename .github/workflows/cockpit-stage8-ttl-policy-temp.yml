name: Validate stage 8 TTL policy
on:
  push:
    branches: [fix/cockpit-ttl-policy-stage8-20260914]
permissions:
  contents: read
jobs:
  validate-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify PR base and apply isolated stage 8 transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 53c5541ad8145ba44bf67d6d7661daf9e7672531)" = 53c5541ad8145ba44bf67d6d7661daf9e7672531
          test "$(git hash-object src/online/cloudflare/cockpitSession.ts)" = 876c90b65b05ae1ca171b829351c1ea599ddb9bb
          test "$(git hash-object src/components/game/CockpitRoomControls.tsx)" = 89a0ecc7fed2560e4f9c5d16a164efbb8f0d465f
          test "$(git hash-object src/components/game/CockpitSessionScreen.tsx)" = 9b7bd291c6255abbca768afce130526f6ec8afc5
          test "$(git hash-object src/online/browser/cockpitClient.ts)" = cd44d92fffe445700b82eee13d862da622d24976
          python .github/stage8-ttl-policy.py
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Format stage 8 product and regressions
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          src/online/cloudflare/cockpitSession.ts
          src/components/game/CockpitRoomControls.tsx
          src/components/game/CockpitSessionScreen.tsx
          src/online/browser/cockpitClient.ts
          src/online/cloudflare/__tests__/cockpitTtlPolicy.test.ts
          src/components/game/CockpitRoomExpiry.test.tsx
      - name: Dedicated issue 12 injected-clock regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/online/cloudflare/__tests__/cockpitTtlPolicy.test.ts
          src/components/game/CockpitRoomExpiry.test.tsx
      - name: Neighboring session and projection regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/online/cloudflare/__tests__/cockpitSession.test.ts
          src/online/cloudflare/__tests__/cockpitLibraryPeekSession.test.ts
          src/online/cloudflare/__tests__/cockpitProjection.test.ts
          src/components/game/CockpitLibraryBrowser.test.tsx
      - name: Build and changed-file lint
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node node_modules/eslint/bin/eslint.js \
            src/online/cloudflare/cockpitSession.ts \
            src/components/game/CockpitRoomControls.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/online/browser/cockpitClient.ts \
            src/online/cloudflare/__tests__/cockpitTtlPolicy.test.ts \
            src/components/game/CockpitRoomExpiry.test.tsx
          git diff --check
      - name: Commit only the validated product and regression tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/stage8-ttl-policy.py .github/workflows/cockpit-stage8-ttl-policy-temp.yml
          git add \
            src/online/cloudflare/cockpitSession.ts \
            src/components/game/CockpitRoomControls.tsx \
            src/components/game/CockpitSessionScreen.tsx \
            src/online/browser/cockpitClient.ts \
            src/online/cloudflare/__tests__/cockpitTtlPolicy.test.ts \
            src/components/game/CockpitRoomExpiry.test.tsx
          test -z "$(git status --porcelain | grep '^??' || true)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'staging: validate issue 12 TTL activity policy'
          git push origin HEAD:refs/heads/fix/cockpit-ttl-policy-stage8-20260914
