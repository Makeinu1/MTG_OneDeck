name: Refine R4 cast union
on:
  push:
    branches:
      - r4a-formal-manual-inventory
    paths:
      - .github/r4-cast-types.marker
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Makeinu1/MTG_OneDeck'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r4a-formal-manual-inventory
          fetch-depth: 0
      - name: Apply exact cast-union refinement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/engine/cockpitR4.ts)" = dc6a4f3bd653e77d804bd3ff83942c8ab0f8e2e8
          printf '%s' '' | base64 -d > /tmp/r4_refine.py
          python /tmp/r4_refine.py
          git diff --check
          git rm .github/r4-cast-types.marker .github/workflows/r4-refine-cast-types.yml
          git add src/engine/cockpitR4.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(r4): model legacy and formal casts explicitly'
          git push origin HEAD:refs/heads/r4a-formal-manual-inventory
