name: Project State Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  project-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check canonical Project State
        run: node scripts/checks/check-project-state.mjs
