name: R4b final normal raw zero v2
on:
  push:
    branches: [r4b-mutation-gate-correction]
permissions:
  contents: write
jobs:
  close-normal-raw:
    if: contains(github.event.head_commit.message, 'retry final normal raw zero')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply audited R4b UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/r4b-final-normal-zero.yml').read_text()
          start = source.index('          from pathlib import Path\n')
          end = source.index('          PY\n      - name: Targeted R4b UI regressions', start)
          code = '\n'.join(line[10:] for line in source[start:end].splitlines())
          exec(compile(code, 'r4b-final-normal-zero-extracted.py', 'exec'), {})

          Path('src/components/game/CockpitNormalRawZero.r4b.test.ts').write_text(r'''import { readFileSync } from 'node:fs';
import { expect, it } from 'vitest';

const read = (path: string) => readFileSync(path, 'utf8');

it('keeps resolution-only raw mutation controls out of Normal UI', () => {
  const session = read('src/components/game/CockpitSessionScreen.tsx');
  const selection = read('src/components/game/CockpitSelectionTools.tsx');

  expect(session).toContain(`<details hidden={!table.resolution}>
              <summary>マナの調整（Resolution）</summary>`);
  expect(session).toContain(`hidden={!table.resolution}
                disabled={disabled}
                onClick={() => void send({ type: 'emptyMana'`);
  expect(session).toContain(`<div hidden={!table.resolution}>
              <CockpitTokenTools`);
  expect(session).toContain(`<div hidden={!table.resolution}>
            <CockpitCardTools`);
  expect(session).toContain(`<details hidden={!table.resolution}>
                <summary>キーワードを付与・解除（Resolution）</summary>`);

  expect(selection).toContain(`key={kind}
            hidden={!table.resolution}`);
  expect(selection).toContain(`hidden={!table.resolution}
          disabled={disabled}
          onClick={() => void send({ type: 'shuffle'`);
  expect(selection).toContain(`hidden={!table.resolution}
          disabled={disabled || count < 1 || count > seat.zones.hand.length}`);
  expect(selection).toContain(`hidden={!table.resolution}
          disabled={disabled}
          onClick={() =>
            setProliferate`);
});
''')
          PY
      - name: Targeted R4b UI regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project dom
          src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts
          src/components/game/CockpitCorrectionTools.r4b.test.tsx
          src/components/game/CockpitNormalRawZero.r4b.test.ts
      - name: Types and build
        run: npm run build
      - name: Lint changed R4b UI
        run: >-
          node node_modules/eslint/bin/eslint.js
          src/online/browser/cockpitClient.ts
          src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts
          src/components/game/CockpitSelectionTools.tsx
          src/components/game/CockpitSessionScreen.tsx
          src/components/game/CockpitCorrectionTools.tsx
          src/components/game/CockpitNormalRawZero.r4b.test.ts
      - name: Commit final Normal ingress closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/online/browser/cockpitClient.ts \
                  src/online/browser/__tests__/cockpitClientR4bNormalUi.test.ts \
                  src/components/game/CockpitSelectionTools.tsx \
                  src/components/game/CockpitSessionScreen.tsx \
                  src/components/game/CockpitCorrectionTools.tsx \
                  src/components/game/CockpitNormalRawZero.r4b.test.ts \
                  .github/workflows/r4b-verification.yml
          git commit -m 'fix(r4b): close Normal raw mutation entrances'
          git push origin HEAD:r4b-mutation-gate-correction
