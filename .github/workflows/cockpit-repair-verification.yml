name: Cockpit repair verification
on:
  push:
    branches: [fix/cockpit-playflow-17-20260914, r3-1-manual-resolution]
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: write
jobs:
  stage1:
    if: inputs.source_sha != '' || !contains(github.event.head_commit.message, '[stage1-assemble]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply staged R3.1 patches when present
        run: |
          if [ -f scripts/r3-1/apply-session-client-ui.mjs ]; then node scripts/r3-1/apply-session-client-ui.mjs; fi
          if [ -f scripts/r3-1/apply-provenance.mjs ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/r3-1/apply-provenance.mjs')
          s = p.read_text()
          s = s.replace("commandId ?? `local-${(table.triggers?.sequence ?? 0) + 1}`", "commandId ?? 'local-' + ((table.triggers?.sequence ?? 0) + 1)")
          p.write_text(s)
          PY
            node scripts/r3-1/apply-provenance.mjs
          fi
      - run: npm ci
      - name: Targeted R3.1 engine tests
        run: node node_modules/vitest/vitest.mjs run --project core src/engine/__tests__/cockpitR31.test.ts src/engine/__tests__/cockpitTriggers.test.ts
      - name: Targeted recovery and SQLite tests
        run: node node_modules/vitest/vitest.mjs run --project dom src/online/browser/__tests__/cockpitClient.test.ts src/online/cloudflare/__tests__/cockpitSession.test.ts
      - name: Types, build, and changed-file lint
        run: |
          npm run build
          node node_modules/eslint/bin/eslint.js src/engine/types.ts src/engine/cockpitR31.ts src/engine/cockpitTable.ts src/engine/cockpitTriggers.ts src/engine/__tests__/cockpitR31.test.ts src/online/browser/cockpitClient.ts src/online/cloudflare/cockpitSession.ts src/components/game/CockpitSessionScreen.tsx src/components/game/CockpitTableSurface.tsx src/components/game/CockpitSelectionTools.tsx src/online/browser/__tests__/cockpitClient.test.ts scripts/online/cockpit-recovery-evidence.mjs
      - name: Commit verified staged patch
        if: success()
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/engine/types.ts src/engine/cockpitR31.ts src/engine/cockpitTable.ts src/engine/cockpitTriggers.ts src/engine/__tests__/cockpitR31.test.ts src/online/browser/cockpitClient.ts src/online/cloudflare/cockpitSession.ts src/components/game/CockpitSessionScreen.tsx src/components/game/CockpitTableSurface.tsx src/components/game/CockpitSelectionTools.tsx
            git commit -m "r3.1: persist process provenance and trigger origin [stage1-assemble]"
            git push origin HEAD:r3-1-manual-resolution
          fi
      - name: Isolated browser and local Worker tools
        run: |
          mkdir -p "$RUNNER_TEMP/cockpit-runtime"
          cd "$RUNNER_TEMP/cockpit-runtime"
          npm init -y >/dev/null
          npm install --save-exact wrangler@4.131.1 playwright@1.63.0
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Real HTTP, Worker, SQLite, and two browsers
        env:
          WRANGLER_SEND_METRICS: false
        shell: bash
        run: |
          set -euo pipefail
          export COCKPIT_EVIDENCE_DIR="$RUNNER_TEMP/cockpit-stage1-evidence"
          export COCKPIT_PLAYWRIGHT_MODULE="$RUNNER_TEMP/cockpit-runtime/node_modules/playwright/index.mjs"
          export COCKPIT_SOURCE_SHA="$(git rev-parse HEAD)"
          mkdir -p "$COCKPIT_EVIDENCE_DIR"
          node "$RUNNER_TEMP/cockpit-runtime/node_modules/wrangler/bin/wrangler.js" dev --local --ip 127.0.0.1 --port 8789 --persist-to "$RUNNER_TEMP/cockpit-sqlite" --log-level error > "$RUNNER_TEMP/cockpit-worker.log" 2>&1 &
          worker=$!
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/cockpit-vite.log" 2>&1 &
          vite=$!
          trap 'kill "$worker" "$vite" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -s --max-time 1 -o /dev/null http://127.0.0.1:8789/ && curl -fsS --max-time 1 -o /dev/null http://127.0.0.1:5173/; then break; fi
            sleep 1
          done
          node scripts/online/cockpit-recovery-evidence.mjs --recovery-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cockpit-stage1-evidence
          path: ${{ runner.temp }}/cockpit-stage1-evidence
          retention-days: 7
          if-no-files-found: warn
